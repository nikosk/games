<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#241b38" />
    <title>The Enchanted Toyshop</title>
    <style>
      :root {
        color-scheme: dark;
        background: #241b38;
      }

      * { box-sizing: border-box; }

      html,
      body,
      #game {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: radial-gradient(circle at 50% 38%, #4f3e68 0%, #241b38 72%);
        touch-action: none;
      }

      #game {
        display: grid;
        place-items: center;
      }

      canvas {
        display: block;
        max-width: 100%;
        max-height: 100%;
        outline: none;
      }

      canvas:focus-visible {
        outline: 4px solid #f9cf6b;
        outline-offset: -4px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
    <script type="module" crossorigin src="/games/cheese-heist/assets/index-CHnqeSo0.js"></script>
  </head>
  <body>
    <main id="game" aria-label="The Enchanted Toyshop visual puzzle game"></main>
    <p class="sr-only">
      A cozy, word-free puzzle game for young children. Tap the four glowing toy displays,
      solve each picture puzzle, and collect the stars that open the moonlit door.
    </p>
  </body>
</html>
