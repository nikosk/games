<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eee9de" />
    <meta name="description" content="Meet Bunny from Bunny’s Picnic in three dimensions. Turn, zoom, and explore a little storybook character." />
    <title>Meet Bunny · A little world in 3D</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23eee9de'/%3E%3Cg fill='%23d6bc8b'%3E%3Cellipse cx='22' cy='22' rx='7' ry='17' transform='rotate(-18 22 22)'/%3E%3Cellipse cx='43' cy='21' rx='7' ry='18' transform='rotate(12 43 21)'/%3E%3Cellipse cx='32' cy='42' rx='20' ry='17'/%3E%3C/g%3E%3Ccircle cx='25' cy='40' r='3' fill='%234b352a'/%3E%3Ccircle cx='41' cy='40' r='3' fill='%234b352a'/%3E%3Cpath d='M29 47L35 47L32 51Z' fill='%23b8606c'/%3E%3C/svg%3E" />
  </head>
  <body>
    <main id="app">
      <div id="viewport" aria-label="Interactive 3D bunny. Drag to rotate; scroll or pinch to zoom." tabindex="0"></div>
      <header class="intro">
        <span class="eyebrow"><span class="seed"></span> BUNNY’S PICNIC</span>
        <h1>Hello, Bunny<span>.</span></h1>
        <p>A familiar friend.<br />A whole new dimension.</p>
      </header>
      <nav class="top-tools" aria-label="Viewer tools">
        <button id="reference-toggle" class="quiet-button" aria-expanded="false" aria-controls="reference-panel">Reference <span aria-hidden="true">↗</span></button>
        <button id="fullscreen" class="icon-button" aria-label="Toggle fullscreen" title="Fullscreen (F)">⛶</button>
      </nav>
      <aside id="reference-panel" hidden>
        <div class="reference-heading"><span id="reference-heading">Where Bunny began</span><button id="reference-close" class="icon-button" aria-label="Close reference artwork">×</button></div>
        <div class="reference-crop"><img id="reference-image" alt="Original painted cream bunny in raspberry dungarees, with brass buttons and a front pocket." /></div>
        <p id="reference-caption">The painted character from Bunny’s Picnic.</p>
      </aside>
      <div id="loading" role="status" aria-live="polite"><div class="loading-ears"><i></i><i></i></div><span>Getting Bunny ready…</span><progress max="100" value="0"></progress></div>
      <div class="view-presets" aria-label="Camera views">
        <button data-view="portrait" class="selected" aria-pressed="true">Portrait</button>
        <button data-view="front" aria-pressed="false">Front</button>
        <button data-view="back" aria-pressed="false">Back</button>
        <button data-view="detail" aria-pressed="false">Close up</button>
      </div>
      <footer class="controls">
        <div class="control-row">
          <div class="poses" role="group" aria-label="Bunny’s expression and movement">
            <button data-pose="Idle" aria-pressed="true" class="selected"><span aria-hidden="true">○</span> Breathe</button>
            <button data-pose="Wave" aria-pressed="false"><span aria-hidden="true">✳</span> Hello</button>
            <button data-pose="Hop" aria-pressed="false"><span aria-hidden="true">⌁</span> Hop</button>
            <button data-pose="Curious" aria-pressed="false"><span aria-hidden="true">?</span> Curious</button>
            <button id="talk" aria-pressed="false" disabled title="Preview talking motion"><span aria-hidden="true">⋯</span> Talk</button>
          </div>
          <div class="divider"></div>
          <div class="settings">
            <button id="spin" aria-pressed="false" title="Slowly turn Bunny"><span aria-hidden="true">↻</span> Turntable</button>
            <button id="pause" aria-pressed="false" title="Pause animation (Space)"><span aria-hidden="true">Ⅱ</span> Pause</button>
          </div>
        </div>
        <div class="under-controls"><span class="gesture-hint">Drag to look around <b>·</b> Pinch or scroll to zoom</span><div class="lighting" role="group" aria-label="Presentation"><button data-stage="garden" class="selected" aria-pressed="true">Garden</button><button data-stage="studio" aria-pressed="false">Studio</button><button data-stage="clay" aria-pressed="false">Clay</button></div></div>
      </footer>
      <div class="downloads"><button id="save-view" title="Save a PNG of this view">Save view ↓</button><a id="download-model" download="bunny.glb">3D model ↓</a><a id="compare-bunny" href="?model=picnic">Previous bunny ↗</a></div>
      <span class="corner-note">Made with care, for a little adventure.</span>
      <div id="toast" role="status" aria-live="polite"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
