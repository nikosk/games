<!doctype html><html lang="el"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#a7ba78"><link rel="icon" href="data:,"><title>Το πικνίκ της παρέας</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#889b65;font-family:system-ui,sans-serif}#game{width:100%;height:100%;touch-action:none}canvas{display:block}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;color:#645131;background:#f6edd8;z-index:2}#loading progress{width:240px;accent-color:#a9b777}#parents{position:fixed;right:12px;top:10px;border:0;border-radius:50%;width:42px;height:42px;background:#fff4d9dd;color:#76613c;font-size:23px;touch-action:none;user-select:none}dialog{border:3px solid #b6a070;border-radius:24px;background:#fff5df;color:#59492f;max-width:90vw;padding:28px}dialog::backdrop{background:#24331bbb}dialog button{font:inherit;padding:14px;margin:6px;border:1px solid #b6a070;border-radius:12px;background:#e5e9c9;color:#59492f}#status{font-size:13px;max-width:360px}#confirm{display:none}
