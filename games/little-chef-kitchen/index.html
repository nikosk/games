<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Little Chef · Cake Workshop</title>
  <link rel="icon" href="data:,">
  <style>
    html,body,#game{width:100%;height:100%;margin:0;overflow:hidden;background:#fbf3e6;touch-action:none}
    canvas{display:block} *{box-sizing:border-box}
    #cake-name{position:fixed;display:none;border:2px solid #d9c5af;border-radius:14px;background:#fffaf1;color:#50382f;font:600 20px Georgia;text-align:center;padding:10px;outline-color:#b85170;touch-action:auto}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  </style>
</head>
<body>
  <main id="game"></main>
  <label class="sr-only" for="cake-name">Name your cake</label>
  <input id="cake-name" maxlength="40" placeholder="Give your cake a name" autocomplete="off">
  <p id="status" class="sr-only" aria-live="polite"></p>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
